[project]
name = "projectkoios-api"
version = "0.0.0"
description = "FastAPI HTTP interface for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = [
    "fastapi>=0.115",
    "projectkoios==0.0.0",
    "projectkoios-agent==0.0.0",
    "projectkoios-obsidian==0.0.0",
    "projectkoios-references==0.0.0",
    "projectkoios-search==0.0.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
equation-review-control = [
    "projectkoios-applications[pdf-corpus]==0.1.0.dev0",
]
dev = [
    "projectkoios-ingestion[pdf]==0.0.0",
    "pytest>=8.0",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that start external processes or touch real services",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = ["src/python", "../projectkoios/src/python", "../projectkoios-agent/src/python", "../projectkoios-references/src/python", "../projectkoios-search/src/python", "../projectkoios-obsidian/src/python"]
namespace_packages = true
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = [
    "projectkoios.applications",
    "projectkoios.applications.*",
    "projectkoios.ingestion",
    "projectkoios.ingestion.*",
    "projectkoios.references",
    "projectkoios.references.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
projectkoios = { git = "https://github.com/eragasa/projectkoios.git", rev = "233f36900b9b44c943ecc5e27f2968ad4bee97ad" }
projectkoios-agent = { path = "../projectkoios-agent", editable = true }
projectkoios-applications = { path = "../projectkoios-applications", editable = false }
projectkoios-ingestion = { git = "https://github.com/eragasa/projectkoios-ingestion.git", rev = "30db4756049b762ec6ea9962d205424a66d699e3" }
projectkoios-obsidian = { path = "../projectkoios-obsidian", editable = true }
projectkoios-references = { path = "../projectkoios-references", editable = true }
projectkoios-search = { path = "../projectkoios-search", editable = true }
