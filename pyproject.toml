[project]
name = "projectkoios-api"
version = "0.0.0"
description = "FastAPI HTTP interface for Project Koios"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = ["src/python", "../projectkoios/src/python", "../projectkoios-search/src/python", "../projectkoios-obsidian/src/python"]
namespace_packages = true
explicit_package_bases = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
