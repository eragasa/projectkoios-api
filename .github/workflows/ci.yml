name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  github-tasks:
    name: Python 3.14 task sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: GitHubTask 01 · Check out API candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: projectkoios-api
          persist-credentials: false

      - name: GitHubTask 02 · Check out published applications owner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-applications
          ref: 781bdb58ce8ce7a4860edc66abaf190b42c91236
          path: projectkoios-applications
          persist-credentials: false

      - name: GitHubTask 03 · Verify locked applications owner
        working-directory: projectkoios-applications
        run: |
          test "$(git rev-parse HEAD)" = "781bdb58ce8ce7a4860edc66abaf190b42c91236"
          test "$(git rev-parse HEAD^{tree})" = "de6257c720fa73caff21b393af4a3fb4858fd617"

      - name: GitHubTask 04 · Check out locked ingestion dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-ingestion
          ref: 30db4756049b762ec6ea9962d205424a66d699e3
          path: projectkoios-ingestion
          persist-credentials: false

      - name: GitHubTask 04a · Verify locked ingestion dependency
        working-directory: projectkoios-ingestion
        run: |
          test "$(git rev-parse HEAD)" = "30db4756049b762ec6ea9962d205424a66d699e3"
          test "$(git rev-parse HEAD^{tree})" = "dd171a3ea215d70bd0852fa4c50ff6e26291ded5"

      - name: GitHubTask 05 · Check out locked Project Koios core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios
          ref: 233f36900b9b44c943ecc5e27f2968ad4bee97ad
          path: projectkoios
          persist-credentials: false

      - name: GitHubTask 05a · Verify locked Project Koios core
        working-directory: projectkoios
        run: |
          test "$(git rev-parse HEAD)" = "233f36900b9b44c943ecc5e27f2968ad4bee97ad"
          test "$(git rev-parse HEAD^{tree})" = "b7c3ffd23086e7ef184c990267d48a56dd87282b"

      - name: GitHubTask 05b · Check out locked public catalog data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios
          ref: 88c37990fd37650b3091b2cb2f605a589ab624f4
          path: projectkoios-public-catalogs
          persist-credentials: false
          sparse-checkout: public

      - name: GitHubTask 05c · Verify locked public catalog data
        working-directory: projectkoios-public-catalogs
        run: |
          test "$(git rev-parse HEAD)" = "88c37990fd37650b3091b2cb2f605a589ab624f4"
          test "$(git rev-parse HEAD^{tree})" = "b102469ba33bc6c677ac93d1186a72b1496f5bc8"

      - name: GitHubTask 06 · Check out locked organizer owner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-agent
          ref: e531cff8f65422d9c0cfab5aaa903c1ebdd778c0
          path: projectkoios-agent
          persist-credentials: false

      - name: GitHubTask 07 · Check out locked search component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-search
          ref: 686d832acae9abeb72f4575738241e0ed858394f
          path: projectkoios-search
          persist-credentials: false

      - name: GitHubTask 08 · Check out locked Obsidian component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-obsidian
          ref: 21820e9fb06306960187cd5853c8b5da45bdcd55
          path: projectkoios-obsidian
          persist-credentials: false

      - name: GitHubTask 09 · Check out locked references component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-references
          ref: f1ca7b4aee552af131ff7af7d1408d33dd338c93
          path: projectkoios-references
          persist-credentials: false

      - name: GitHubTask 09a · Verify locked references component
        working-directory: projectkoios-references
        run: |
          test "$(git rev-parse HEAD)" = "f1ca7b4aee552af131ff7af7d1408d33dd338c93"
          test "$(git rev-parse HEAD^{tree})" = "b37672e36af13014dc25170be725fbf3f909c2d7"

      - name: GitHubTask 10 · Install locked Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.25"
          python-version: "3.14"
          working-directory: projectkoios-api
          enable-cache: false

      - name: GitHubTask 11 · Synchronize locked environment
        working-directory: projectkoios-api
        run: uv sync --locked --all-extras

      - name: GitHubTask 12 · Validate public catalogs
        working-directory: projectkoios-api
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from projectkoios.api.courses import PublicCourseRepository
          from projectkoios.api.projects import PublicProjectRepository

          root = Path("../projectkoios-public-catalogs/public")
          courses = PublicCourseRepository(
              root / "course-catalog.json"
          ).list_courses()
          projects = PublicProjectRepository(
              root / "project-catalog.json"
          ).list_projects()
          assert sum(len(item.courses) for item in courses.institutions) == 40
          assert any(project.id == "projectkoios" for project in projects.projects)
          PY

      - name: GitHubTask 13 · Check formatting
        working-directory: projectkoios-api
        run: .venv/bin/python -m ruff format --check src/python tests

      - name: GitHubTask 14 · Lint
        working-directory: projectkoios-api
        run: .venv/bin/python -m ruff check src/python tests

      - name: GitHubTask 15 · Type-check API source
        working-directory: projectkoios-api
        run: .venv/bin/python -m mypy --strict src/python/projectkoios/api

      - name: GitHubTask 16 · Check generated OpenAPI
        working-directory: projectkoios-api
        run: .venv/bin/python -m projectkoios.api.openapi --check

      - name: GitHubTask 17 · Run tests
        working-directory: projectkoios-api
        run: .venv/bin/python -m pytest -q
