name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  github-tasks:
    name: Python 3.14 task sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: GitHubTask 01 · Check out API candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: projectkoios-api
          persist-credentials: false

      - name: GitHubTask 02 · Report unavailable applications owner source
        run: |
          echo "::error::projectkoios-applications 312f42e is unpushed; hosted equation-review verification is unavailable"
          exit 1

      - name: GitHubTask 03 · Check out locked Project Koios core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios
          ref: 0b0988d9c9e8bc778b3e90eb20c406e3c6a4a90e
          path: projectkoios
          persist-credentials: false

      - name: GitHubTask 04 · Check out locked search component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-search
          ref: 686d832acae9abeb72f4575738241e0ed858394f
          path: projectkoios-search
          persist-credentials: false

      - name: GitHubTask 05 · Check out locked Obsidian component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-obsidian
          ref: 21820e9fb06306960187cd5853c8b5da45bdcd55
          path: projectkoios-obsidian
          persist-credentials: false

      - name: GitHubTask 06 · Check out locked references component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eragasa/projectkoios-references
          ref: b7581cb5f8a619883ecd73ed1d9354b85e5f57fd
          path: projectkoios-references
          persist-credentials: false

      - name: GitHubTask 07 · Install locked Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.25"
          python-version: "3.14"
          working-directory: projectkoios-api
          enable-cache: false

      - name: GitHubTask 08 · Synchronize locked environment
        working-directory: projectkoios-api
        run: uv sync --locked --all-extras

      - name: GitHubTask 09 · Check formatting
        working-directory: projectkoios-api
        run: .venv/bin/python -m ruff format --check src/python tests

      - name: GitHubTask 10 · Lint
        working-directory: projectkoios-api
        run: .venv/bin/python -m ruff check src/python tests

      - name: GitHubTask 11 · Type-check API source
        working-directory: projectkoios-api
        run: .venv/bin/python -m mypy --strict src/python/projectkoios/api

      - name: GitHubTask 12 · Check generated OpenAPI
        working-directory: projectkoios-api
        run: .venv/bin/python -m projectkoios.api.openapi --check

      - name: GitHubTask 13 · Run tests
        working-directory: projectkoios-api
        run: .venv/bin/python -m pytest -q
